name: Build, Test, and Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PG_HOST: ${{ secrets.PG_HOST }}
      PG_PORT: ${{ secrets.PG_PORT }}
      PG_NAME: ${{ secrets.PG_NAME }}
      POSTGRES_USER: ${{ secrets.PG_ROOT_USER }}
      POSTGRES_PASSWORD: ${{ secrets.PG_ROOT_PASS }}
      PG_USER: ${{ secrets.PG_USER }}
      PG_PASS: ${{ secrets.PG_PASS }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.PG_NAME }}
          POSTGRES_USER: ${{ secrets.PG_ROOT_USER }}
          POSTGRES_PASSWORD: ${{ secrets.PG_ROOT_PASS }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -v ${{ github.workspace }}/db/postgres-init.db:/docker-entrypoint-initdb.d/init.db

    steps:
      - name: Inspect before cleanup
        if: always()
        run: ls -laR "${{ github.workspace }}"

      - name: Cleanup workspace pre-checkout
        run: |
          chmod -R u+rwx "${{ github.workspace }}" || true
          sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}" || true
          rm -rf "${{ github.workspace }}/."* "${{ github.workspace }}"/* || true

      - name: actions/checkout
        uses: actions/checkout@v4
        with:
          clean: 'clobber'

      - name: Install PostgreSQL client tools (for act/local)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
          pg_isready -h localhost -p 5432 && break
          sleep 1
          done

      - name: Make init script executable
        run: chmod +x db/postgres-init.sh

      - name: Run database initialization script
        run: db/postgres-init.sh
        env:
          PGHOST: localhost
          POSTGRES_USER: ${{ secrets.PG_ROOT_USER }}
          POSTGRES_DB: ${{ secrets.PG_NAME }}
          PG_USER: ${{ secrets.PG_USER }}
          PG_PASS: ${{ secrets.PG_PASS }}
          PGPASSWORD: ${{ secrets.PG_ROOT_PASS }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Liquibase migrations
        run: ./gradlew update

      - name: Build and Test
        run: ./gradlew build --no-daemon

      - name: Upload Jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/html

