name: life-balance-dev

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${PG_PORT}:5432"
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_ROOT_USER}
      POSTGRES_PASSWORD: ${PG_ROOT_PASS}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
    volumes:
      - planner-data:/var/lib/postgresql/data
      - ./db/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  planner-data:
