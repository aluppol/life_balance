version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: life-balance-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: life_balance
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
