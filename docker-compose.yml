services:
  postgres:
    image: postgres:16
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_ROOT_USER}
      POSTGRES_PASSWORD: ${PG_ROOT_PASS}
      PG_LB_USER: ${PG_LB_USER}
      PG_LB_PASS: ${PG_LB_PASS}
      PG_AUTH_USER: ${PG_AUTH_USER}
      PG_AUTH_PASS: ${PG_AUTH_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - life_balance
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -d \"$PG_NAME\" -U \"$PG_ROOT_USER\"" ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

  auth:
    build:
      context: .
      dockerfile: Dockerfile.auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://postgres:5432/${PG_NAME}"
      KC_DB_USERNAME: ${PG_AUTH_USER}
      KC_DB_PASSWORD: ${PG_AUTH_PASS}
      KC_DB_SCHEMA: auth

      KC_HOSTNAME_URL: ${AUTH_BASE_URL:-}
      KC_HOSTNAME_STRICT: ${AUTH_HOSTNAME_STRICT:-false}

      KC_PROXY: ${AUTH_PROXY_MODE:-edge}
      KC_HTTP_ENABLED: ${AUTH_HTTP_ENABLED:-true}
    command: ["${AUTH_START_CMD:-start-dev}" ]
    ports:
      - "${AUTH_PORT}:8080"
    networks:
      - life_balance
    restart: unless-stopped

  auth-config-cli:
    image: docker.io/adorsys/keycloak-config-cli:6.4.0-26
    depends_on: [ auth ]
    environment:
      KEYCLOAK_URL: "http://auth:${AUTH_PORT}"
      KEYCLOAK_USER: ${AUTH_ADMIN}
      KEYCLOAK_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: "120s"
      IMPORT_FILES_LOCATIONS: "/cfg/auth.config.yaml"
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      IMPORT_REMOTESTATE_ENABLED: "true"
      AUTH_REALM: ${AUTH_REALM}
      LB_CLIENT_ID: ${LB_CLIENT_ID}
      LB_CLIENT_SECRET: ${LB_CLIENT_SECRET}
      LB_REDIRECT_1: ${LB_REDIRECT_1}
      LB_REDIRECT_2: ${LB_REDIRECT_2}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO}
      SMTP_REPLY_TO_NAME: ${SMTP_REPLY_TO_NAME}
    volumes:
      - ./auth.config.yaml:/cfg/auth.config.yaml:ro
    networks: [ life_balance ]
    restart: "no"

volumes:
  pgdata:

networks:
  life_balance: