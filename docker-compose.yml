version: '3.9'

services:
  postgres:
    image: postgres:16
    ports:
      - "${PG_PORT}:5432"
    environment:
      POSTGRES_DB: ${PG_NAME}
      POSTGRES_USER: ${PG_ROOT_USER}
      POSTGRES_PASSWORD: ${PG_ROOT_PASS}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - life_balance

volumes:
  pgdata:

networks:
  life_balance: