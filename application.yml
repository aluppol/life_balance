server.port: ${LB_PORT}
spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_NAME}
    username: ${PG_LB_USER}
    password: ${PG_LB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none  # disable automatic schema generation
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: core
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: core
    default-schema: core             # apply changesets to core
    liquibase-schema: public         # store metadata in public

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_BASE_URL}/realms/${AUTH_REALM}

auth:
  kc:
    base-url: ${AUTH_BASE_URL}
    realm: ${AUTH_REALM}
    client-id: ${LB_CLIENT_ID}
    client-secret: ${LB_CLIENT_SECRET}

app:
  security.expected-audience: lifebalance