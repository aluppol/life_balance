plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.liquibase.gradle' version '2.2.0'
	id 'jacoco'
	id 'org.owasp.dependencycheck' version '8.4.2'
}

group = 'com.luppol'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

configurations {
	liquibaseRuntime
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.liquibase:liquibase-core'
	implementation 'org.postgresql:postgresql:42.7.3'
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	implementation 'com.github.java-json-tools:json-patch:1.13'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	testImplementation 'org.testcontainers:postgresql:1.19.7'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.19.7'

	liquibaseRuntime 'org.liquibase:liquibase-core'
	liquibaseRuntime 'info.picocli:picocli:4.7.5'
	liquibaseRuntime 'org.postgresql:postgresql:42.7.5'
	liquibaseRuntime sourceSets.main.output  // Include project classes and resources

	runtimeOnly 'org.postgresql:postgresql:42.7.3'

}

liquibase {
	activities {
		main {
			changeLogFile 'src/main/resources/db/changelog/db.changelog-master.xml'
			url "jdbc:postgresql://${System.getenv('PG_HOST')}:${System.getenv('PG_PORT')}/${System.getenv('PG_NAME')}"
			username System.getenv('PG_USER')
			password System.getenv('PG_PASS')
			driver 'org.postgresql.Driver'
		}
	}
	runList = 'main'  // Use the 'main' activity by default for Liquibase tasks
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports { html.required = true }    // output → build/reports/jacoco/html
}

tasks.named('test') {
	useJUnitPlatform()
}
